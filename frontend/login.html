<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Sistema Taller Pro</title>
    
    <!-- Tipografía y Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --error: #ef4444;
            --bg-canvas: #f8fafc;
            --glass: rgba(255, 255, 255, 0.95);
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-canvas);
            /* Gradiente sutil de fondo profesional */
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%), 
                              radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.05) 0px, transparent 50%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        .login-container { 
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 2.5rem; 
            border-radius: calc(var(--radius) * 2); 
            border: 1px solid white;
            box-shadow: var(--shadow); 
            width: 90%; 
            max-width: 400px; 
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .profile-img {
            width: 100px; height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            padding: 3px;
            background: white;
            transition: transform 0.3s ease;
        }

        .login-container:hover .profile-img { transform: scale(1.05); }

        h1 { color: var(--text-main); font-size: 1.75rem; font-weight: 700; letter-spacing: -0.025em; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.25rem; text-align: left; }
        
        label { 
            display: block;
            font-size: 0.75rem; 
            font-weight: 600; 
            color: var(--text-main); 
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-relative { position: relative; }

        input { 
            width: 100%; 
            padding: 0.8rem 1rem; 
            border: 1.5px solid var(--border); 
            border-radius: var(--radius); 
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #fff;
        }

        input:focus { 
            border-color: var(--primary); 
            outline: none; 
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }

        .toggle-pass { 
            position: absolute; 
            right: 1rem; 
            top: 50%; 
            transform: translateY(-50%);
            cursor: pointer; 
            color: var(--text-muted);
            padding: 5px;
        }

        .btn-login { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            padding: 1rem; 
            border: none; 
            border-radius: var(--radius); 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 1rem; 
            margin-top: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover:not(:disabled) { 
            background: var(--primary-hover); 
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Toast Mejorado */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--text-main);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show { transform: translateX(0); }
        .toast.error { border-left: 4px solid var(--error); }
        .toast.success { border-left: 4px solid var(--success); }

        .loader {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="notification" class="toast">
        <i id="toastIcon" class="fa-solid"></i>
        <span id="toastMessage"></span>
    </div>

    <main class="login-container" id="loginCard">
        <div class="profile-wrapper">
            <img src="https://via.placeholder.com/100" alt="Usuario" class="profile-img" id="login-avatar">
        </div>
        
        <h1>Sistema Taller</h1>
        <p class="subtitle">Gestión Administrativa Profesional</p>
        
        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div class="input-relative">
                    <input type="email" id="email" placeholder="nombre@ejemplo.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="input-relative">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fa-solid fa-eye toggle-pass" id="togglePassword"></i>
                </div>
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
                <span id="btnText">Entrar al Sistema</span>
                <div class="loader" id="btnLoader"></div>
            </button>
        </form>
    </main>

    <script>
        const DOM = {
            form: document.getElementById('loginForm'),
            email: document.getElementById('email'),
            pass: document.getElementById('password'),
            btn: document.getElementById('btnLogin'),
            btnText: document.getElementById('btnText'),
            loader: document.getElementById('btnLoader'),
            avatar: document.getElementById('login-avatar'),
            toast: document.getElementById('notification'),
            togglePass: document.getElementById('togglePassword')
        };

        // --- Persistencia de Usuario ---
        const loadPreferences = () => {
            const saved = JSON.parse(localStorage.getItem('taller_admin'));
            if (saved) {
                if (saved.foto) DOM.avatar.src = saved.foto;
                if (saved.correo) DOM.email.value = saved.correo;
            }
        };

        // --- UI Helpers ---
        const showToast = (msg, type = 'success') => {
            const icon = type === 'success' ? 'fa-circle-check' : 'fa-circle-xmark';
            DOM.toast.className = `toast show ${type}`;
            document.getElementById('toastIcon').className = `fa-solid ${icon}`;
            document.getElementById('toastMessage').innerText = msg;
            
            setTimeout(() => DOM.toast.classList.remove('show'), 4000);
        };

        // --- Event Listeners ---
        DOM.togglePass.addEventListener('click', () => {
            const isPass = DOM.pass.type === 'password';
            DOM.pass.type = isPass ? 'text' : 'password';
            DOM.togglePass.classList.toggle('fa-eye');
            DOM.togglePass.classList.toggle('fa-eye-slash');
        });

        DOM.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validación básica
            if (!DOM.form.checkValidity()) {
                showToast('Por favor, completa los campos correctamente', 'error');
                return;
            }

            // Estado de carga
            DOM.btn.disabled = true;
            DOM.btnText.style.opacity = '0';
            DOM.loader.style.display = 'block';

            try {
                const response = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        correo: DOM.email.value,
                        password: DOM.pass.value
                    })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('session', JSON.stringify(data));
                    showToast(`¡Bienvenido, ${data.nombre || 'Administrador'}!`);
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    throw new Error(data.message || 'Credenciales inválidas');
                }
            } catch (error) {
                showToast(error.message === 'Failed to fetch' ? 'Servidor fuera de línea' : error.message, 'error');
                DOM.btn.disabled = false;
                DOM.btnText.style.opacity = '1';
                DOM.loader.style.display = 'none';
            }
        });

        window.onload = loadPreferences;
    </script>
</body>
</html>
